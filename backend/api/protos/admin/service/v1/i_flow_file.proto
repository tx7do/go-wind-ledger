syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "ledger/service/v1/flow_file.proto";

// 流水附件服务（Admin BFF）
service FlowFileService {
  // 按流水ID查询附件列表
  rpc List (ledger.service.v1.ListFlowFileRequest) returns (ledger.service.v1.ListFlowFileResponse) {
    option (google.api.http) = {
      get: "/admin/v1/flow-files"
    };
  }

  // 删除附件
  rpc Delete (ledger.service.v1.DeleteFlowFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/flow-files/{id}"
    };
  }

  // 上传附件
  rpc UploadFile (ledger.service.v1.UploadFlowFileRequest) returns (ledger.service.v1.FlowFile) {
    option (google.api.http) = {
      post: "/admin/v1/flow-files/upload"
      body: "*"
    };
  }

  // 查看附件（免认证，按 create_time 安全验证）
  rpc ViewFile (ledger.service.v1.ViewFlowFileRequest) returns (ledger.service.v1.ViewFlowFileResponse) {
    option (google.api.http) = {
      get: "/admin/v1/flow-files/view"
    };
  }
}
