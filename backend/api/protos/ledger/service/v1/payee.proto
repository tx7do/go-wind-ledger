syntax = "proto3";

package ledger.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "pagination/v1/pagination.proto";

// 收款人服务
service PayeeService {
  rpc List (pagination.PagingRequest) returns (ListPayeeResponse) {}
  rpc ListAll (ListAllPayeeRequest) returns (ListPayeeResponse) {}
  rpc Get (GetPayeeRequest) returns (Payee) {}
  rpc Create (CreatePayeeRequest) returns (Payee) {}
  rpc Update (UpdatePayeeRequest) returns (Payee) {}
  rpc Delete (DeletePayeeRequest) returns (google.protobuf.Empty) {}
  rpc Toggle (TogglePayeeRequest) returns (Payee) {}
  rpc ToggleCanExpense (TogglePayeeRequest) returns (Payee) {}
  rpc ToggleCanIncome (TogglePayeeRequest) returns (Payee) {}
}

message Payee {
  optional uint32 id = 1 [json_name = "id"];
  optional uint32 tenant_id = 2 [json_name = "tenantId"];
  optional uint32 book_id = 3 [json_name = "bookId"];

  optional string name = 10 [json_name = "name"];
  optional string notes = 11 [json_name = "notes"];
  optional bool enable = 12 [json_name = "enable"];

  optional bool can_expense = 13 [json_name = "canExpense"];
  optional bool can_income = 14 [json_name = "canIncome"];

  optional int32 sort_order = 15 [json_name = "sortOrder"];

  optional uint32 created_by = 100 [json_name = "createdBy"];
  optional uint32 updated_by = 101 [json_name = "updatedBy"];
  optional uint32 deleted_by = 102 [json_name = "deletedBy"];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt"];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt"];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt"];
}

message ListPayeeResponse {
  repeated Payee items = 1;
  uint64 total = 2;
}

message ListAllPayeeRequest {
  optional uint32 book_id = 1 [json_name = "bookId"];
}

message GetPayeeRequest {
  uint32 id = 1 [json_name = "id"];
  optional google.protobuf.FieldMask view_mask = 100 [json_name = "viewMask"];
}

message CreatePayeeRequest {
  Payee data = 1;
}

message UpdatePayeeRequest {
  uint32 id = 1;
  Payee data = 2;
  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask"];
  optional bool allow_missing = 4 [json_name = "allowMissing"];
}

message DeletePayeeRequest {
  uint32 id = 1 [json_name = "id"];
}

message TogglePayeeRequest {
  uint32 id = 1 [json_name = "id"];
}
