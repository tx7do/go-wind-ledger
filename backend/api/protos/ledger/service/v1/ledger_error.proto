syntax = "proto3";

package ledger.service.v1;

import "errors/errors.proto";

// 记账系统错误定义
enum LedgerErrorReason {
  option (errors.default_code) = 500;

  // 400
  BAD_REQUEST = 0 [(errors.code) = 400];

  // 401
  UNAUTHORIZED = 100 [(errors.code) = 401];

  // 403
  FORBIDDEN = 300 [(errors.code) = 403];

  // 404
  NOT_FOUND = 400 [(errors.code) = 404];

  // 409
  CONFLICT = 900 [(errors.code) = 409];            // 名称重复等冲突
  GROUP_AUTH_ERROR = 901 [(errors.code) = 403];    // 群组权限不足

  // 422
  UNPROCESSABLE_ENTITY = 1100 [(errors.code) = 422];

  // 429
  TOO_MANY_REQUESTS = 1160 [(errors.code) = 429];
  MAX_LIMIT_EXCEEDED = 1161 [(errors.code) = 429];  // 超过最大数量限制

  // 500
  INTERNAL_SERVER_ERROR = 2000 [(errors.code) = 500];
  UPLOAD_FAILED = 2001 [(errors.code) = 500];
  DOWNLOAD_FAILED = 2002 [(errors.code) = 500];
}
