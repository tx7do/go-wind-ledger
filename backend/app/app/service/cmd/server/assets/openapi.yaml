                    format: uint32
                data:
                    $ref: '#/components/schemas/ledger.service.v1.Payee'
                updateMask:
                    type: string
                    format: field-mask
                allowMissing:
                    type: boolean
        ledger.service.v1.UpdateTagRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
                    $ref: '#/components/schemas/ledger.service.v1.Tag'
                updateMask:
                    type: string
                    format: field-mask
                allowMissing:
                    type: boolean
        ledger.service.v1.UploadFlowFileRequest:
            type: object
            properties:
                flowId:
                    type: integer
                    format: uint32
                fileName:
                    type: string
                contentType:
                    type: string
                size:
                    type: string
                data:
                    type: string
                    format: bytes
            description: 请求 - 上传附件
        ledger.service.v1.ViewFlowFileResponse:
            type: object
            properties:
                contentType:
                    type: string
                originalName:
                    type: string
                data:
                    type: string
                    format: bytes
            description: 回应 - 查看附件（返回文件内容）
        storage.service.v1.DownloadFileResponse:
            type: object
            properties:
                file:
                    type: string
                    description: 直接返回文件字节（小文件或同步场景）
                    format: bytes
                downloadUrl:
                    type: string
                    description: 预签名 URL（大文件或异步下载）
                sourceFileName:
                    type: string
                    description: 原始文件名，客户端用于保存或显示
                mime:
                    type: string
                    description: MIME 类型，默认 application/octet-stream
                size:
                    type: string
                    description: 文件大小（字节），可用于进度或校验
                checksum:
                    type: string
                    description: 可选，文件校验（如 MD5 或 SHA256）
                storagePath:
                    type: string
                    description: 可选，后端存储位置或 key
                updatedAt:
                    type: string
                    description: 可选，最后修改时间
                    format: date-time
            description: 文件下载响应
        storage.service.v1.PresignOption:
            type: object
            properties:
                method:
                    type: string
                    description: 预签名使用的 HTTP 方法，例如 PUT 或 POST
                expireSeconds:
                    type: integer
                    description: 预签名有效期（秒）
                    format: int32
                contentType:
                    type: string
                    description: 预签名约束的 Content-Type（可选）
            description: 预签名选项
        storage.service.v1.StorageObject:
            type: object
            properties:
                bucketName:
                    type: string
                    description: 目标文件桶名称
                fileDirectory:
                    example: tenant/1001/user/avatar/
                    type: string
                    description: 存储目录（如 'user/1001/avatar/'），服务端会在此目录下生成唯一文件名
                objectName:
                    example: user/1001/avatar.jpg
                    type: string
                    description: OSS 对象键（完整路径，如 'user/1001/avatar.jpg'）。若未提供，服务端将自动生成。
            description: 对象存储对象
        storage.service.v1.UploadFileRequest:
            type: object
            properties:
                storageObject:
                    $ref: '#/components/schemas/storage.service.v1.StorageObject'
                file:
                    type: string
                    description: 直接上传的文件内容（内联字节）
                    format: bytes
                presign:
                    $ref: '#/components/schemas/storage.service.v1.PresignOption'
                sourceFileName:
                    type: string
                    description: 原文件文件名
                mime:
                    type: string
                    description: 文件的MIME类型
                size:
                    type: string
                    description: 文件大小（字节）
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                userId:
                    type: integer
                    description: 用户ID
                    format: uint32
        storage.service.v1.UploadFileResponse:
            type: object
            properties:
                objectName:
                    type: string
                    description: OSS 对象键
                presignedUrl:
                    type: string
                    description: 预签名上传链接
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh-token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
